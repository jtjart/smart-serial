[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smart-serial"
dynamic = ["version"]
description = "Asyncio library for controlling SMART Technologies AV devices (e.g. SMART UX60 projector) over a serial (RS-232) connection."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Your Name", email = "you@example.com" }]
keywords = [
    "smart",
    "ux60",
    "projector",
    "serial",
    "rs232",
    "asyncio",
    "av-control",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Home Automation",
    "Topic :: System :: Hardware",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]
dependencies = ["pyserial-asyncio-fast>=0.14"]

[project.urls]
Homepage = "https://github.com/jtjart/smart-serial"
Documentation = "https://github.com/jtjart/smart-serial#readme"
Issues = "https://github.com/jtjart/smart-serial/issues"
Changelog = "https://github.com/jtjart/smart-serial/blob/main/CHANGELOG.md"

[project.scripts]
smart-serial = "smart_serial.cli:main"

[tool.hatch.version]
path = "src/smart_serial/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/smart_serial"]

[dependency-groups]
dev = [
    "build>=1.2",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pyright",
    "ruff",
]


# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",       # pycodestyle
    "W",       # pycodestyle warnings
    "F",       # pyflakes
    "I",       # isort
    "B",       # flake8-bugbear
    "UP",      # pyupgrade
    "ASYNC",   # flake8-async
    "SIM",     # flake8-simplify
    "C4",      # flake8-comprehensions
    "PIE",     # flake8-pie
    "RET",     # flake8-return
    "RUF",     # Ruff-specific
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"


# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests"]

warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true

disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true

no_implicit_optional = true
no_implicit_reexport = true

strict_equality = true
strict_concatenate = true

show_error_codes = true
pretty = true


# ---------------------------------------------------------------------------
# Pyright
# ---------------------------------------------------------------------------

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.10"
reportMissingImports = "error"
reportMissingTypeStubs = "error"


# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]


# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------

[tool.coverage.run]
branch = true
source = ["smart_serial"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "@overload",
    "raise NotImplementedError",
]
