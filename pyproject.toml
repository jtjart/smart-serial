[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smart-serial"
dynamic = ["version"]
description = "Asyncio library for controlling SMART Technologies AV devices (e.g. SMART UX60 projector) over a serial (RS-232) connection, with an extensible driver registry for additional models."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Your Name", email = "you@example.com" }]
keywords = [
    "smart",
    "ux60",
    "projector",
    "serial",
    "rs232",
    "asyncio",
    "av-control",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Home Automation",
    "Topic :: System :: Hardware",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]
dependencies = ["pyserial-asyncio-fast>=0.14"]

[project.urls]
Homepage = "https://github.com/jtjart/smart-serial"
Documentation = "https://github.com/jtjart/smart-serial#readme"
Issues = "https://github.com/jtjart/smart-serial/issues"
Changelog = "https://github.com/jtjart/smart-serial/blob/main/CHANGELOG.md"

[project.scripts]
smart-serial = "smart_serial.cli:main"

[project.entry-points."smart_serial.devices"]
"smart:ux60" = "smart_serial.devices.smart.ux60:SmartUX60"

[tool.hatch.version]
path = "src/smart_serial/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/smart_serial"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "build>=1.2",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
]
